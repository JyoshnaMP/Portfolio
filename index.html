<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Joe - Portfolio</title>

<style>
  body {
    margin: 0;
    background: #f2f2f2;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 60px;
  }

  .logo {
    font-size: 24px;
    font-weight: bold;
    color: #7b2ff7;
  }

  nav a {
    margin: 0 12px;
    text-decoration: none;
    color: #333;
    font-weight: bold;
  }

  .talk-btn {
    background: #7b2ff7;
    color: white;
    padding: 10px 20px;
    border: none;
    border-radius: 25px;
    font-weight: bold;
    cursor: pointer;
  }

  .hero {
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 40px 60px;
    margin-top: 60px;
  }

  .text {
    max-width: 500px;
  }

  .text h1 {
    font-size: 40px;
    margin: 0;
    cursor: pointer;
  }

  .text h1 span {
    color: #7b2ff7;
  }

  .text h2 {
    color: #444;
    margin: 5px 0 15px;
  }

  .text p {
    color: #666;
    line-height: 1.6;
  }

  .buttons button {
    padding: 12px 24px;
    margin-right: 10px;
    border-radius: 25px;
    border: 2px solid #7b2ff7;
    font-weight: bold;
    cursor: pointer;
  }

  .btn-fill {
    background: #7b2ff7;
    color: white;
  }

  .btn-outline {
    background: white;
    color: #7b2ff7;
  }

  .avatar img {
    width: 600px;
    height: 480px;
    object-fit: cover;
    cursor: pointer;
  }

  .nav {
    margin-right: 640px;
  }

  .color-btn {
    background: white;
    border: 2px solid #7b2ff7;
    border-radius: 50%;
    width: 42px;
    height: 42px;
    font-size: 18px;
    cursor: pointer;
  }
</style>
</head>

<body>

<header>

  <div class="logo">Joe.</div>

  <nav class="nav">
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Portfolio</a>
    <a href="#">Blog</a>
    <a href="#" onclick="showContact()">Contact</a>
  </nav>

  <button class="talk-btn">Let's Talk</button>

  <button class="color-btn" onclick="changeColor()">🎨</button>

</header>


<div class="hero">

  <div class="text">

    <h1 onclick="changeNameColor()">
      Hi, I'm <span id="name">Joe Greyson</span>
    </h1>

    <h2>Frontend Developer</h2>

    <p>
      Lorem ipsum dolor sit amet consectetur adipisicing elit.
      Inventore et officiis suscipit ut assumenda libero tenetur.
    </p>

    <div class="buttons">
      <button class="btn-fill">Hire Me</button>
      <button class="btn-outline">See Projects</button>
    </div>

  </div>


  <div class="avatar">

    <img
      id="profileImage"
      onclick="changeImage()"
      src="https://static.vecteezy.com/system/resources/previews/046/822/339/non_2x/a-professional-and-confident-business-woman-smiling-isolated-on-a-transparent-background-free-png.png"
      alt="Joe Greyson"
    >

  </div>

</div>


<script>

function showContact() {
  alert(
    "📧 Email: joe@example.com\n" +
    "📱 Phone: +1 (555) 234-5678\n" +
    "💼 LinkedIn: linkedin.com/in/joe"
  );
}


function changeColor() {

  const colors = [
    "#f2f2f2",
    "#fff4e6",
    "#e8f5e9",
    "#e3f2fd",
    "#fce4ec"
  ];

  const randomColor =
    colors[Math.floor(Math.random() * colors.length)];

  document.body.style.backgroundColor = randomColor;
}
</script>
<script>

function changeImage() {

  const image = document.getElementById("profileImage");

  image.src =
    "./portfolio.png";

}


function changeNameColor() {
  const name = document.getElementById("name");

  name.style.color = "#ff4081";
}

</script>

</body>
</html>
